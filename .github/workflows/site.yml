# Met à jour le site (usage personnel, même contenu que l'application locale) : recalcule les prédictions
# avec les données joueurs, les compositions et l'actualité, puis publie le dossier site/ sur GitHub Pages.
# Déclenchement : toutes les 30 minutes de 10 h à minuit (heure de Paris), toutes les trois heures la nuit,
# à chaque envoi sur la branche principale, ou à la main (onglet Actions, « Run workflow »).
# Le planificateur de GitHub retarde ou saute parfois des exécutions quand ses serveurs sont chargés :
# des créneaux rapprochés compensent ces pertes.
name: Mettre à jour le site

on:
  schedule:
    - cron: "7,37 9-23 * * *"          # heures UTC (minutes décalées : les heures pleines sont les plus chargées)
    - cron: "7 0,3,6 * * *"
  push:
    branches: [main]
    paths-ignore: ["results/predictions_log_public.csv"]
  workflow_dispatch:

permissions:
  contents: write        # pour enregistrer le journal de suivi
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false        # une exécution en cours n'est jamais interrompue ; la suivante attend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      # Données joueurs (compositions, valeurs marchandes 2012-2026) : jeu figé, téléchargé une seule fois puis gardé en cache
      - uses: actions/cache@v4
        id: tm
        with:
          path: data/external/transfermarkt
          key: transfermarkt-2026-07
      - name: Télécharger les données joueurs
        if: steps.tm.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/external/transfermarkt
          for t in games players player_valuations appearances game_lineups; do
            curl -sfL -o "data/external/transfermarkt/$t.csv.gz" "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/$t.csv.gz"
          done
      # Résultats, calendriers, tableaux de scores et compositions déjà téléchargés, stock d'articles d'actualité :
      # gardés d'une exécution à l'autre (seuls les éléments nouveaux sont téléchargés)
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed/news_items.pkl
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Calculer les prédictions et construire le site
        run: python build_site.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Enregistrer le journal de suivi
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add results/predictions_log_public.csv
          git diff --cached --quiet || git commit -m "Journal de suivi du site"
          git pull --rebase -q || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Publication refusée par une panne passagère de GitHub Pages : nouvelle tentative une minute plus tard
      - name: Attendre avant une nouvelle tentative
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
