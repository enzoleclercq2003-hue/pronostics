# Met à jour le site hébergé : recalcule les prédictions et publie le dossier site/ sur GitHub Pages.
# Déclenchement : sept fois par jour, à chaque envoi sur la branche principale, ou à la main (onglet Actions).
name: Mettre à jour le site

on:
  schedule:
    - cron: "15 5,11,15,17,19,21,23 * * *"   # heures UTC : toutes les deux heures l'après-midi et le soir, pour suivre les résultats
  push:
    branches: [main]
    paths-ignore: ["results/predictions_log_public.csv"]
  workflow_dispatch:

permissions:
  contents: write        # pour enregistrer le journal de suivi
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      # Les fichiers de résultats des saisons passées ne changent plus : on les garde d'une exécution à l'autre
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Calculer les prédictions et construire le site
        run: python build_site.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Enregistrer le journal de suivi
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add results/predictions_log_public.csv
          git diff --cached --quiet || git commit -m "Journal de suivi du site"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
